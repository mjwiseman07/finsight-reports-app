# Advisacor Development Orchestrator — PR CI
#
# Validates orchestrator changes on pull requests to main.
# Mocked tests only. No CURSOR_API_KEY. No Cloud Agents. No deploy. No merge.

name: Orchestrator CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/orchestrator/**"
      - "tests/orchestrator/**"
      - "docs/agent/**"
      - "docs/plans/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/orchestrator-ci.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/orchestrator/**"
      - "tests/orchestrator/**"
      - "docs/agent/**"
      - "docs/plans/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/orchestrator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestrator-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    name: Orchestrator validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Orchestrator unit tests (mocked)
        run: npm run orchestrator:test
        env:
          # Explicitly empty — mocked suite must not require Cursor API access
          CURSOR_API_KEY: ""

      - name: Orchestrator script syntax lint
        run: npm run orchestrator:lint

      - name: Brand lint
        run: npm run brand:lint
